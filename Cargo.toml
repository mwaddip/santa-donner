[package]
name = "donner-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SANTA block-tier conformance runner over ergo-node-rust's digest validation"

[[bin]]
name = "donner-runner"
path = "src/main.rs"

[dependencies]
# enr's validation crate via the santa-run-managed symlink (dasher pattern):
# santa-run receives <impl-path> and points enr-impl at it before building.
ergo-validation = { path = "enr-impl/validation", features = ["json"] }
# Header-tier + section-binding checks the node performs OUTSIDE validation/
# (chain validates headers before blocks; the wire's modifier-id binding
# checks section↔header correspondence at download). Donner replays both
# using the node's own functions — the runner measures node code, never a
# parallel reimplementation.
enr-chain = { path = "enr-impl/chain" }
ergo-mining = { path = "enr-impl/mining" }
# NiPoPoW prover API — same rev as enr's own sigma-rust pin, not a new pin.
ergo-nipopow = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
ergo-chain-types = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }
sigma-ser = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "f76db922" }

# For the dump-avl-tree binary (reads state.redb directly)
enr-state = { path = "enr-impl/state" }
ergo_avltree_rust = "0.1.1"
redb = "4"
bytes = "1"

# NO direct sigma-rust dep — donner uses ENR's RE-EXPORTS (enr_chain::{Header, ADDigest,
# BlockId}, ergo_validation::{Parameters, Parameter, Transaction, ErgoBox, ErgoStateContext}),
# so there is exactly ONE sigma-rust version — enr's, via the path-deps above — and NO rev for
# the runner to pin and drift on as enr advances (the prior `git+rev` here broke the build when
# enr moved). ergo-validation's `json` feature (below) gives the re-exported Header/Transaction
# their Deserialize impls; feature-unification onto ergo-chain-types/json carries it to
# enr_chain::Header too. The conformance subject is enr's code at runner.json's `#main` — exactly
# what it pins.

serde_json = "1"
hex = "0.4"

# ── DERIVED, NOT HAND-MAINTAINED ─────────────────────────────────────────────
#
# [patch] applies at the consuming build root ONLY — a path-dep does NOT inherit
# enr's patch table, so donner's table governs enr's own crates in this build.
# Every entry in enr's root [patch.crates-io] must be restated here, or the crate
# silently resolves to crates.io instead of what enr actually ships.
#
# `santa-run` now DERIVES the block below from the staged enr's own manifest on
# every run, copying each pin VERBATIM. Do not hand-edit between the markers: it
# is overwritten at stage time, and the committed content is only a snapshot so a
# direct `cargo build` still works.
#
# Why derived rather than restated — hand-restating failed twice:
#   · ergo_avltree_rust drifted 16 commits behind enr while pinned by rev.
#   · redb was never restated AT ALL. enr vendors a MODIFIED redb
#     (Database::{set_read_cache_limit,clear_read_cache}, used by
#     enr-state/src/storage.rs), added 2026-07-29 (5c5c76c, v0.7.7). donner
#     resolved stock crates.io redb 4.0.0, which lacks those methods, so
#     enr-state failed to compile through donner for three weeks while building
#     clean standalone.
#
# The second failure is the instructive one: not a wrong version, but an entry
# nobody knew existed. Derivation fixes that class; a bumped rev would not have.
#
# Why VERBATIM (donner no longer floats on `main`) — agreed with the
# ergo-node-rust session 2026-08-04 (reply-santa-derive-patch-table.md). Floating
# was only ever compensation for hand-matching: donner could not drift behind if
# it never named a version. Derivation removes the drift risk, so the
# compensation is no longer needed, and verbatim buys something floating cannot —
# a green donner cell means "enr commit X, built against exactly the dependency
# closure X declares, conforms", which anyone can reproduce by checking out X.
# Floating meant "X built against whatever `main` was when the grader ran".
#
# The accepted downside: if enr's pin lags a fix on fork `main`, donner grades the
# unfixed version and may go red on something already solved upstream. That is
# CORRECT — it is a real finding against a real released artefact, and the remedy
# is to bump enr's pin. A harness that silently grades a fix enr has not shipped
# is reporting on a node that does not exist.
# >>> DERIVED-PATCH-TABLE >>>
[patch.crates-io]
ergo_avltree_rust = { git = "https://github.com/mwaddip/ergo_avltree_rust.git", rev = "568e7c3" }
redb = { path = "enr-impl/patches/redb" }
# <<< DERIVED-PATCH-TABLE <<<

# ── dump-avl-tree binary ──────────────────────────────────────────────────
[[bin]]
name = "dump-avl-tree"
path = "src/bin/dump_avl_tree.rs"
required-features = []

[profile.release]
debug = false
