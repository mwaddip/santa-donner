[package]
name = "donner-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SANTA block-tier conformance runner over ergo-node-rust's digest validation"

[[bin]]
name = "donner-runner"
path = "src/main.rs"

[dependencies]
# enr's validation crate via the santa-run-managed symlink (dasher pattern):
# santa-run receives <impl-path> and points enr-impl at it before building.
ergo-validation = { path = "enr-impl/validation" }
# Header-tier + section-binding checks the node performs OUTSIDE validation/
# (chain validates headers before blocks; the wire's modifier-id binding
# checks section↔header correspondence at download). Donner replays both
# using the node's own functions — the runner measures node code, never a
# parallel reimplementation.
enr-chain = { path = "enr-impl/chain" }
ergo-mining = { path = "enr-impl/mining" }

# MUST match enr's pins exactly (validation/Cargo.toml) so Header/Transaction/
# Parameters types unify across the path-dep boundary. Build-identity per
# runner-contract §3: donner's conformance subject = enr validation + this
# sigma-rust rev + the avltree fork pin below.
ergo-lib = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "00ae06f7", features = ["json"] }
ergo-chain-types = { git = "https://github.com/mwaddip/sigma-rust.git", rev = "00ae06f7", features = ["json"] }

serde_json = "1"
hex = "0.4"

# Replicated from enr's workspace root: [patch] applies at the consuming build
# root only — a path-dep does NOT inherit enr's patch table. Same story as
# blitzen-eni (crates.io avltree verifier panics on degenerate proofs).
[patch.crates-io]
ergo_avltree_rust = { git = "https://github.com/mwaddip/ergo_avltree_rust.git", rev = "2fc88d83" }

[profile.release]
debug = false
